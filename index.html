<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super RPS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1 style="margin-bottom: 20px;">SUPER RPS</h1>
        <div class="ctop">
            <div class="user">
                <button id="rock">Rock</button>
                <button id="paper">Paper</button>
                <button id="scissors">Scissors</button>
                <p id="uscore">YOU: 0</p>
            </div>
            <div class="computer">
                <p id="computer">CPU READY...</p>
                <p id="cscore">CPU: 0</p>
            </div>
        </div>
        <button id="start">FIGHT!</button>
        <p id="winner">READY?</p>
    </div>
    <script src="file.js"></script>
</body>

</html>
